name: Build and Release Windows (x64 & ARM64)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone latest LibRaw
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/LibRaw/LibRaw.git third_party/LibRaw

      - name: Build LibRaw, CR3WICCodec & packages (${{ matrix.arch }})
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Arch ${{ matrix.arch }} -Package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run WIC decoder smoke test on CC0 CR3 sample (${{ matrix.arch }})
        shell: pwsh
        run: |
          $sample = ".\docs\images\canon-eos-r6-mark-iii-sample.CR3"
          $outPng = ".\build\ci_smoke.png"
          & .\build\bin\test_decoder.exe $sample $outPng --thumb --meta --preview --transform --dll ".\build\bin\CR3WICCodec.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $outPng) -or -not (Test-Path ".\build\ci_smoke_thumb.png")) {
            Write-Error "CI smoke test did not produce expected PNG outputs."
            exit 1
          }
          Remove-Item ".\build\ci_smoke*.png" -Force -ErrorAction SilentlyContinue

      - name: Upload build artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: CR3WICCodec-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download x64 & ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CR3WICCodec-*
          path: release-artifacts

      - name: Merge release files and generate unified SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Get-ChildItem -Path "release-artifacts" -Recurse -File | Where-Object { $_.Extension -in @(".zip", ".exe") } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "dist\$($_.Name)" -Force
          }
          $hashLines = Get-ChildItem -Path "dist" -File | Where-Object { $_.Extension -in @(".zip", ".exe") } | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          if (-not $hashLines) {
            Write-Error "No release binaries found in dist/."
            exit 1
          }
          Set-Content -Path "dist\SHA256SUMS.txt" -Value $hashLines -Encoding ASCII
          Get-Content "dist\SHA256SUMS.txt"

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v', 'V')
          $outPath = "build/release-notes.md"
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          function Get-ChangelogSection {
            param([string[]]$AllLines, [string]$HeaderPattern)
            $inSec = $false
            $secLevel = 0
            $buf = [System.Collections.Generic.List[string]]::new()
            foreach ($line in $AllLines) {
              if (-not $inSec) {
                if ($line -match $HeaderPattern) {
                  $inSec = $true
                  $secLevel = $Matches[1].Length
                }
                continue
              }
              if ($line -match "^(#{1,2})\s+" -and $Matches[1].Length -le $secLevel) {
                break
              }
              $buf.Add($line)
            }
            return ($buf -join "`n").Trim()
          }

          $lines = Get-Content -Path "CHANGELOG.md" -Encoding UTF8
          $escapedTag = [regex]::Escape($tag)
          $body = Get-ChangelogSection -AllLines $lines -HeaderPattern "^(#{1,2})\s+\[?$escapedTag\]?(?:\s|$)"
          $template = Get-ChangelogSection -AllLines $lines -HeaderPattern "^(#{1,2})\s+Release Downloads Template(?:\s|$)"

          if (-not [string]::IsNullOrWhiteSpace($template)) {
            $template = $template.Replace("{{TAG}}", $tag).Replace("{{VERSION}}", $version)
          }

          if ([string]::IsNullOrWhiteSpace($body)) {
            Write-Warning "No section for '$tag' found in CHANGELOG.md; falling back to auto-generated release notes."
            "has_notes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $fullNotes = if ([string]::IsNullOrWhiteSpace($template)) {
              $body
            } elseif ($body.Contains("{{DOWNLOADS_TEMPLATE}}")) {
              $body.Replace("{{DOWNLOADS_TEMPLATE}}", $template)
            } else {
              "$body`n`n---`n`n$template"
            }
            $fullNotes = $fullNotes.Replace("{{TAG}}", $tag).Replace("{{VERSION}}", $version)
            Set-Content -Path $outPath -Value $fullNotes -Encoding UTF8
            "has_notes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Extracted release notes for $tag (template attached: $([bool]$template))."
          }

      - name: Publish GitHub Release (from CHANGELOG.md)
        if: steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/release-notes.md
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release (auto-generated fallback)
        if: steps.changelog.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

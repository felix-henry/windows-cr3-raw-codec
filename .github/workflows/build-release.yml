name: Build and Release Windows x64

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone latest LibRaw
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/LibRaw/LibRaw.git third_party/LibRaw

      - name: Build LibRaw (x64, OpenMP, universal SSE2)
        shell: cmd
        run: |
          cd third_party\LibRaw
          nmake -f Makefile.msvc "COPT_OPT=/openmp" bin\libraw.dll lib\libraw.lib

      - name: Configure and build CR3WICCodec
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run WIC decoder smoke test on CC0 CR3 sample
        shell: pwsh
        run: |
          $sample = ".\docs\images\canon-eos-r6-mark-iii-sample.CR3"
          $outPng = ".\build\ci_smoke.png"
          & .\build\bin\test_decoder.exe $sample $outPng --thumb --dll ".\build\bin\CR3WICCodec.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $outPng) -or -not (Test-Path ".\build\ci_smoke_thumb.png")) {
            Write-Error "CI smoke test did not produce expected PNG outputs."
            exit 1
          }
          Remove-Item ".\build\ci_smoke*.png" -Force -ErrorAction SilentlyContinue

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package portable ZIP and Inno Setup installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CR3WICCodec-x64
          path: |
            dist/*.zip
            dist/*.exe

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $outPath = "build/release-notes.md"
          New-Item -ItemType Directory -Force -Path "build" | Out-Null

          $lines = Get-Content -Path "CHANGELOG.md" -Encoding UTF8
          $escapedTag = [regex]::Escape($tag)
          $inSection = $false
          $sectionLevel = 0
          $collected = [System.Collections.Generic.List[string]]::new()

          foreach ($line in $lines) {
            if (-not $inSection) {
              if ($line -match "^(#{1,2})\s+\[?$escapedTag\]?(?:\s|$)") {
                $inSection = $true
                $sectionLevel = $Matches[1].Length
              }
              continue
            }

            if ($line -match "^(#{1,2})\s+" -and $Matches[1].Length -le $sectionLevel) {
              break
            }
            $collected.Add($line)
          }

          $body = ($collected -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            Write-Warning "No section for '$tag' found in CHANGELOG.md; falling back to auto-generated release notes."
            "has_notes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Set-Content -Path $outPath -Value $body -Encoding UTF8
            "has_notes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Extracted $($collected.Count) lines for $tag from CHANGELOG.md."
          }

      - name: Publish GitHub Release (from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v') && steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/release-notes.md
          files: |
            dist/*.zip
            dist/*.exe

      - name: Publish GitHub Release (auto-generated fallback)
        if: startsWith(github.ref, 'refs/tags/v') && steps.changelog.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
